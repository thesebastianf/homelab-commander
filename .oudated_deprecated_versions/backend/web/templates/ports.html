{{define "content"}}
<div class="top-bar">
  <div>
    <div class="page-title">Port Overview</div>
    <div class="page-subtitle">All published host ports across every container</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:.6rem;align-items:center">
    <button class="btn btn-sm" onclick="htmx.trigger('#ports-table','refresh')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</div>

<!-- Summary stats -->
<div class="stat-grid" id="ports-stats"
     hx-get="/api/v1/ports"
     hx-trigger="load, every 20s"
     hx-swap="innerHTML"
     hx-target="#ports-stats"
     hx-on::after-request="renderPortsTable(event)">
  <div class="stat-card"><div class="stat-label">Total Bindings</div><div class="stat-value">—</div></div>
  <div class="stat-card"><div class="stat-label">Active (running)</div><div class="stat-value">—</div></div>
  <div class="stat-card"><div class="stat-label">Inactive (stopped)</div><div class="stat-value">—</div></div>
  <div class="stat-card"><div class="stat-label">Port Conflicts</div><div class="stat-value">—</div></div>
</div>

<!-- Filter bar -->
<div class="g-card" style="padding:.75rem 1rem;margin-bottom:.75rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
  <input id="port-filter" class="form-input" placeholder="Filter by container name, port or image…"
         style="flex:1;min-width:200px"
         oninput="filterPortRows(this.value)">
  <div style="display:flex;gap:.4rem">
    <button class="btn btn-sm" id="f-all"     onclick="setStateFilter('all')"     style="background:var(--accent-glow);color:var(--accent)">All</button>
    <button class="btn btn-sm" id="f-running" onclick="setStateFilter('running')">Running</button>
    <button class="btn btn-sm" id="f-stopped" onclick="setStateFilter('stopped')">Stopped</button>
    <button class="btn btn-sm" id="f-conflict" onclick="setStateFilter('conflict')" style="color:var(--red)">Conflicts</button>
  </div>
</div>

<!-- Ports table -->
<div class="g-card" style="padding:0;overflow:hidden">
  <table class="data-table" id="ports-table">
    <thead>
      <tr>
        <th style="width:2.4rem"></th>
        <th>Container</th>
        <th>Image</th>
        <th>Host Port</th>
        <th>Container Port</th>
        <th>Proto</th>
        <th>Bind IP</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody id="ports-tbody">
      <tr><td colspan="8" class="loading">Loading ports…</td></tr>
    </tbody>
  </table>
</div>

<!-- Conflict panel (hidden until conflicts exist) -->
<div id="conflict-panel" style="display:none;margin-top:1rem">
  <div class="section-title" style="color:var(--red)">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Port Conflicts
  </div>
  <div id="conflict-list" class="g-card" style="padding:.5rem 1rem"></div>
</div>

<style>
.data-table { width:100%; border-collapse:collapse; font-size:.82rem; }
.data-table th {
  text-align:left; padding:.55rem 1rem;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid var(--glass-border);
  color:var(--text2); font-weight:500; text-transform:uppercase;
  font-size:.7rem; letter-spacing:.05em;
}
.data-table td {
  padding:.5rem 1rem;
  border-bottom:1px solid var(--glass-border);
  vertical-align:middle;
}
.data-table tbody tr:last-child td { border-bottom:none; }
.data-table tbody tr:hover td { background:rgba(255,255,255,.02); }
.data-table tbody tr.conflict-row td { background:rgba(255,107,107,.05); }
.data-table tbody tr.stopped-row { opacity:.55; }
.state-dot {
  width:8px; height:8px; border-radius:50%;
  display:inline-block; margin:auto;
}
.state-dot.running { background:var(--green); box-shadow:0 0 6px var(--green); }
.state-dot.stopped { background:var(--text3); }
.state-dot.paused  { background:var(--yellow); }
.port-badge {
  font-family:monospace; font-size:.8rem;
  background:var(--glass2); border:1px solid var(--glass-border);
  border-radius:6px; padding:.1rem .45rem;
}
.port-badge.conflict { border-color:var(--red); color:var(--red); background:var(--red-bg); }
.img-text { color:var(--text2); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-icon svg { width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2; }
.link-icon:hover svg { stroke:#fff; }
</style>

<script>
let _portsAll = [];
let _stateFilter = 'all';
let _textFilter = '';
let _conflictPorts = new Set();

// HTMX fires this after the stats hx-get returns. We capture the JSON to
// populate the table in JS (keeping DOM manipulation fast and avoiding a
// second round-trip for the table).
document.body.addEventListener('htmx:afterRequest', (ev) => {
  if (ev.detail.pathInfo && ev.detail.pathInfo.requestPath === '/api/v1/ports') {
    try {
      const data = JSON.parse(ev.detail.xhr.responseText);
      renderStats(data);
      _portsAll = data.entries || [];
      _conflictPorts = new Set(Object.keys(data.conflict_map || {}).map(Number));
      applyFilters();
      renderConflicts(data.conflict_map || {});
    } catch(e) {}
  }
});

function renderStats(data) {
  const grid = document.getElementById('ports-stats');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Bindings</div><div class="stat-value">${data.total_ports}</div></div>
    <div class="stat-card"><div class="stat-label">Active (running)</div><div class="stat-value" style="color:var(--green)">${data.running_ports}</div></div>
    <div class="stat-card"><div class="stat-label">Inactive (stopped)</div><div class="stat-value" style="color:var(--text2)">${data.stopped_ports}</div></div>
    <div class="stat-card"><div class="stat-label">Port Conflicts</div><div class="stat-value" style="color:${data.conflicts > 0 ? 'var(--red)' : 'var(--green)'}">${data.conflicts}</div></div>
  `;
}

function applyFilters() {
  let rows = _portsAll;
  if (_stateFilter === 'running')  rows = rows.filter(r => r.state === 'running');
  if (_stateFilter === 'stopped')  rows = rows.filter(r => r.state !== 'running');
  if (_stateFilter === 'conflict') rows = rows.filter(r => _conflictPorts.has(r.host_port));
  if (_textFilter) {
    const q = _textFilter.toLowerCase();
    rows = rows.filter(r =>
      r.container_name.toLowerCase().includes(q) ||
      r.image.toLowerCase().includes(q) ||
      String(r.host_port).includes(q) ||
      String(r.container_port).includes(q)
    );
  }
  renderTable(rows);
}

function filterPortRows(val) { _textFilter = val; applyFilters(); }

function setStateFilter(f) {
  _stateFilter = f;
  ['all','running','stopped','conflict'].forEach(id => {
    const btn = document.getElementById('f-'+id);
    if (btn) {
      btn.style.background = id === f ? 'var(--accent-glow)' : '';
      btn.style.color = id === 'conflict' ? 'var(--red)' : (id === f ? 'var(--accent)' : '');
    }
  });
  applyFilters();
}

function renderTable(entries) {
  const tbody = document.getElementById('ports-tbody');
  if (!entries.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="padding:1.5rem;text-align:center;color:var(--text2)">No ports match the current filter.</td></tr>';
    return;
  }
  tbody.innerHTML = entries.map(e => {
    const isConflict = _conflictPorts.has(e.host_port);
    const rowClass = isConflict ? 'conflict-row' : (e.state !== 'running' ? 'stopped-row' : '');
    const dotClass = e.state === 'running' ? 'running' : (e.state === 'paused' ? 'paused' : 'stopped');
    const portClass = isConflict ? 'port-badge conflict' : 'port-badge';
    const shortImg = e.image.replace(/^.*\//,'').replace(/@sha256:.*/,'');
    const link = e.homepage_url
      ? `<a href="${escHtml(e.homepage_url)}" target="_blank" rel="noopener" class="link-icon" title="${escHtml(e.homepage_url)}"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`
      : `<a href="http://${location.hostname}:${e.host_port}" target="_blank" rel="noopener" class="link-icon" title="Open :${e.host_port}"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`;
    return `<tr class="${rowClass}">
      <td style="text-align:center"><span class="state-dot ${dotClass}" title="${escHtml(e.state)}"></span></td>
      <td><span style="font-weight:500">${escHtml(e.container_name)}</span></td>
      <td><span class="img-text" title="${escHtml(e.image)}">${escHtml(shortImg)}</span></td>
      <td><span class="${portClass}">${e.host_port}</span></td>
      <td><span class="port-badge">${e.container_port}</span></td>
      <td style="color:var(--text2)">${escHtml(e.protocol)}</td>
      <td style="color:var(--text2);font-family:monospace;font-size:.78rem">${escHtml(e.host_ip || '0.0.0.0')}</td>
      <td>${link}</td>
    </tr>`;
  }).join('');
}

function renderConflicts(conflictMap) {
  const panel = document.getElementById('conflict-panel');
  const list = document.getElementById('conflict-list');
  if (!Object.keys(conflictMap).length) { panel.style.display='none'; return; }
  panel.style.display = '';
  list.innerHTML = Object.entries(conflictMap).map(([port, owners]) => `
    <div style="margin:.5rem 0;padding:.6rem;background:var(--red-bg);border-radius:var(--radius-sm);border:1px solid rgba(255,107,107,.2)">
      <span style="color:var(--red);font-weight:600">Port ${port}</span> claimed by ${owners.length} containers:
      ${owners.map(o => `<span style="margin-left:.4rem;padding:.1rem .4rem;background:var(--glass2);border-radius:4px;font-size:.78rem">${escHtml(o.container_name)} (${escHtml(o.state)})</span>`).join(' ')}
    </div>
  `).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{{end}}
