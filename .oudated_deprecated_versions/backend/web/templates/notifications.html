{{define "content"}}
<div class="top-bar">
  <div>
    <div class="page-title">Notifications</div>
    <div class="page-subtitle">Dispatch channels &amp; history</div>
  </div>
  <button class="btn btn-primary" onclick="document.getElementById('add-channel-modal').classList.add('open')">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Channel
  </button>
</div>

<div class="section-title">Active Channels</div>
<div id="channels-list" hx-get="/ui/notifications/channels" hx-trigger="load" hx-swap="innerHTML" class="g-card">
  <div class="loading">Loading channels…</div>
</div>

<div class="section-title" style="margin-top:1.4rem">Recent Notifications</div>
<div id="notif-history" hx-get="/ui/notifications/history" hx-trigger="load" hx-swap="innerHTML" class="g-card">
  <div class="loading">Loading history…</div>
</div>

<!-- Add Channel Modal -->
<div id="add-channel-modal" class="modal-backdrop">
  <div class="modal g-card">
    <div class="modal-title">Add Notification Channel</div>
    <form hx-post="/api/v1/notifications/channels" hx-swap="none" hx-on::after-request="document.getElementById('add-channel-modal').classList.remove('open');htmx.trigger('#channels-list','load')">
      <div class="form-group">
        <label class="form-label">Channel Type</label>
        <select name="type" class="form-input">
          <option value="telegram">Telegram</option>
          <option value="discord">Discord</option>
          <option value="gotify">Gotify</option>
          <option value="ntfy">Ntfy</option>
          <option value="email">Email (SMTP)</option>
          <option value="webhook">Webhook</option>
        </select>
      </div>
      <div class="form-group" style="margin-top:.6rem">
        <label class="form-label">Name</label>
        <input name="name" type="text" class="form-input" placeholder="My Channel" required>
      </div>
      <div class="form-group" style="margin-top:.6rem">
        <label class="form-label">Config (JSON)</label>
        <textarea name="config_json" class="form-input mono" rows="4" placeholder='{"token":"...","chat_id":"..."}'></textarea>
      </div>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
        <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-backdrop').classList.remove('open')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Channel</button>
      </div>
    </form>
  </div>
</div>
{{end}}
