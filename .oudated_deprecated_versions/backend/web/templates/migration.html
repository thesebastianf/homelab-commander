{{define "content"}}
<div class="top-bar">
  <div>
    <div class="page-title">Migration</div>
    <div class="page-subtitle">Export &amp; import server configurations</div>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.2rem">
  <!-- Export -->
  <div class="g-card">
    <div class="section-title">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </div>
    <p style="font-size:.8rem;color:var(--text2);margin-bottom:1rem">
      Package stacks, env vars, settings, and backups into a portable archive.
    </p>
    <form hx-post="/api/v1/migrate/export" hx-swap="none" hx-on::after-request="handleExportResult(event)">
      <div class="form-group">
        <label class="form-label">Destination Path</label>
        <input name="dest_path" type="text" class="form-input mono" placeholder="/tmp/hlc-export" required>
      </div>
      <div class="toggle-row" style="margin-top:.8rem">
        <div class="toggle-info">
          <div class="toggle-label">Include Backups</div>
          <div class="toggle-desc">Attach volume backup archives</div>
        </div>
        <input type="checkbox" name="include_backups" value="true" style="cursor:pointer">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:1rem;width:100%">Start Export</button>
    </form>
    <div id="export-result" style="margin-top:.8rem"></div>
  </div>

  <!-- Import -->
  <div class="g-card">
    <div class="section-title">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import
    </div>
    <p style="font-size:.8rem;color:var(--text2);margin-bottom:1rem">
      Restore from an export archive and remap paths for the new server.
    </p>
    <div class="form-group">
      <label class="form-label">Archive Path</label>
      <input type="text" id="import-path" class="form-input mono" placeholder="/tmp/hlc-export.tar.gz">
    </div>
    <button class="btn btn-outline" style="margin-top:.6rem;width:100%" onclick="analyzeImport()">Analyze Archive</button>
    <div id="import-analysis" style="margin-top:.8rem"></div>
    <button id="import-execute-btn" class="btn btn-primary" style="margin-top:.6rem;width:100%;display:none" onclick="executeImport()">Execute Import</button>
  </div>
</div>

<script>
function handleExportResult(event) {
  const detail = event.detail;
  const el = document.getElementById('export-result');
  if (detail.successful) {
    el.innerHTML = '<div class="badge badge-green">Export started — check audit log for result</div>';
  } else {
    el.innerHTML = '<div class="badge badge-red">Export failed</div>';
  }
}

function analyzeImport() {
  const path = document.getElementById('import-path').value;
  fetch('/api/v1/migrate/import/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({archive_path: path})
  }).then(r => r.json()).then(data => {
    document.getElementById('import-analysis').innerHTML =
      '<pre style="font-size:.72rem;color:var(--text2);overflow:auto">' + JSON.stringify(data, null, 2) + '</pre>';
    document.getElementById('import-execute-btn').style.display = 'block';
  });
}

function executeImport() {
  const path = document.getElementById('import-path').value;
  fetch('/api/v1/migrate/import/execute', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({archive_path: path})
  }).then(r => r.json()).then(data => {
    document.getElementById('import-analysis').innerHTML =
      '<div class="badge badge-green">Import complete</div>' +
      '<pre style="font-size:.72rem;color:var(--text2)">' + JSON.stringify(data, null, 2) + '</pre>';
    document.getElementById('import-execute-btn').style.display = 'none';
  });
}
</script>
{{end}}
