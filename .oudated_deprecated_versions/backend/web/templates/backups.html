{{define "content"}}
<div class="top-bar">
  <div>
    <div class="page-title">Backups</div>
    <div class="page-subtitle">Volume snapshots &amp; restore points</div>
  </div>
  <button class="btn btn-primary" hx-post="/api/v1/backup/_all" hx-swap="none"
    hx-on::after-request="htmx.trigger('#backup-list','load')"
    hx-confirm="Trigger backup for all labelled containers?">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Backup All
  </button>
</div>

<div class="g-card">
  <input type="text" class="form-input" placeholder="Search backups…" style="margin-bottom:.8rem;width:100%" id="backup-search">
  <div id="backup-list" hx-get="/ui/backups" hx-trigger="load" hx-swap="innerHTML">
    <div class="loading">Loading backups…</div>
  </div>
</div>

<!-- Restore confirmation modal -->
<div id="restore-modal" class="modal-backdrop">
  <div class="modal g-card">
    <div class="modal-title">Restore Backup</div>
    <p style="font-size:.82rem;color:var(--text2);margin-bottom:1rem">
      This will stop the container, replace its data, and restart it. A pre-restore snapshot will be created.
    </p>
    <div id="restore-dry-run-result"></div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-ghost" onclick="document.getElementById('restore-modal').classList.remove('open')">Cancel</button>
      <button id="restore-confirm-btn" class="btn btn-red">Restore</button>
    </div>
  </div>
</div>

<script>
function openRestoreModal(container, backupID) {
  document.getElementById('restore-modal').classList.add('open');
  fetch('/api/v1/restore/dry-run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({container_name: container, backup_id: backupID})
  }).then(r => r.json()).then(data => {
    document.getElementById('restore-dry-run-result').innerHTML =
      '<div class="badge badge-yellow" style="margin-bottom:.6rem">Dry-run complete</div>' +
      '<pre style="font-size:.72rem;color:var(--text2)">' + JSON.stringify(data, null, 2) + '</pre>';
    document.getElementById('restore-confirm-btn').onclick = () => doRestore(container, backupID);
  });
}

function doRestore(container, backupID) {
  fetch('/api/v1/restore', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({container_name: container, backup_id: backupID})
  }).then(() => {
    document.getElementById('restore-modal').classList.remove('open');
    htmx.trigger('#backup-list', 'load');
  });
}
</script>
{{end}}
