<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .card { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 12; }
      .header-bg { fill: #13131a; opacity: 0.9; }
      .text-primary { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .accent-bg { fill: #6d5acd; }
      .success { fill: #22c55e; }
      .stopped { fill: #71717a; }
      .tab-active { fill: #1a1a2e; rx: 8; }
      .badge-primary { fill: #6d5acd; rx: 9; }
      .badge-success { fill: rgba(34,197,94,0.15); rx: 8; }
      .badge-stopped { fill: rgba(113,113,122,0.15); rx: 8; }
      .badge-failed { fill: rgba(239,68,68,0.15); rx: 8; }
      .btn-primary { fill: #6d5acd; rx: 8; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d5acd"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1440" height="900"/>

  <!-- Header -->
  <rect class="header-bg" x="0" y="0" width="1440" height="72"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#23233a"/>
  <rect x="40" y="16" width="40" height="40" rx="10" fill="url(#headerGrad)"/>
  <text x="52" y="42" fill="#fff" font-family="JetBrains Mono" font-size="16" font-weight="700">⬡</text>
  <text x="92" y="36" class="text-mono" font-size="22" font-weight="700">HLC</text>
  <text x="92" y="52" class="text-muted" font-size="11">Homelab Command</text>

  <!-- Tabs -->
  <text x="60" y="115" class="text-muted" font-size="13">🏠 Dashboard</text>

  <rect class="tab-active" x="155" y="92" width="96" height="36"/>
  <text x="170" y="115" fill="#e4e4e7" font-family="Roboto" font-size="13" font-weight="500">📦 Stacks</text>
  <rect x="248" y="100" width="18" height="18" rx="9" class="badge-primary"/>
  <text x="253" y="113" fill="#fff" font-family="JetBrains Mono" font-size="11">5</text>

  <text x="284" y="115" class="text-muted" font-size="13">📦 Containers</text>
  <text x="408" y="115" class="text-muted" font-size="13">💽 Volumes</text>
  <text x="502" y="115" class="text-muted" font-size="13">🖼 Images</text>
  <text x="586" y="115" class="text-muted" font-size="13">🌐 Networks</text>

  <!-- Title bar -->
  <text x="40" y="168" class="text-mono" font-size="18" font-weight="600">Docker Compose Stacks</text>
  <text x="40" y="186" class="text-muted" font-size="12">Deploy and manage multi-container applications</text>

  <!-- New Stack Button -->
  <rect class="btn-primary" x="1300" y="155" width="100" height="36"/>
  <text x="1320" y="178" fill="#fff" font-family="Roboto" font-size="13" font-weight="500">+ New Stack</text>

  <!-- Left Panel: Stack List -->
  <text x="40" y="224" class="text-muted-mono" font-size="11" font-weight="600">STACKS</text>
  <rect x="440" y="212" width="40" height="18" rx="4" stroke="#23233a" fill="transparent"/>
  <text x="450" y="225" class="text-muted-mono" font-size="10">5/5</text>

  <!-- Search -->
  <rect x="40" y="236" width="440" height="34" rx="6" stroke="#23233a" fill="#0a0a0f"/>
  <text x="66" y="258" class="text-muted-mono" font-size="12">🔍 Search stacks...</text>

  <!-- Filter button -->
  <rect x="40" y="278" width="440" height="32" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="190" y="298" class="text-muted-mono" font-size="11">⧖ Filter by Status</text>

  <!-- Stack list items -->
  <!-- Stack 1: monitoring (selected, running) -->
  <rect x="40" y="322" width="440" height="80" rx="8" fill="rgba(109,90,205,0.08)" stroke="#23233a"/>
  <rect x="40" y="322" width="4" height="80" rx="2" class="success"/>
  <text x="64" y="345" fill="#6d5acd" font-size="14">📦</text>
  <text x="86" y="345" class="text-mono" font-size="13" font-weight="600">monitoring</text>
  <rect x="404" y="332" width="60" height="20" rx="6" class="badge-success"/>
  <text x="414" y="346" class="success" font-size="9" font-family="JetBrains Mono">running</text>
  <text x="86" y="366" class="text-muted" font-size="10">4 services • v3</text>
  <rect x="86" y="376" width="36" height="16" rx="4" stroke="#23233a" fill="transparent"/>
  <text x="92" y="388" class="text-muted-mono" font-size="8">:3000</text>
  <rect x="128" y="376" width="36" height="16" rx="4" stroke="#23233a" fill="transparent"/>
  <text x="134" y="388" class="text-muted-mono" font-size="8">:9090</text>
  <rect x="170" y="376" width="36" height="16" rx="4" stroke="#23233a" fill="transparent"/>
  <text x="176" y="388" class="text-muted-mono" font-size="8">:9093</text>

  <!-- Stack 2: media (running) -->
  <rect x="40" y="410" width="440" height="70" rx="8" fill="transparent" stroke="#23233a"/>
  <rect x="40" y="410" width="4" height="70" rx="2" class="success"/>
  <text x="64" y="438" fill="#6d5acd" font-size="14">📦</text>
  <text x="86" y="438" class="text-mono" font-size="13" font-weight="600">media-stack</text>
  <rect x="404" y="426" width="60" height="20" rx="6" class="badge-success"/>
  <text x="414" y="440" class="success" font-size="9" font-family="JetBrains Mono">running</text>
  <text x="86" y="460" class="text-muted" font-size="10">6 services • v2</text>

  <!-- Stack 3: network (running) -->
  <rect x="40" y="488" width="440" height="70" rx="8" fill="transparent" stroke="#23233a"/>
  <rect x="40" y="488" width="4" height="70" rx="2" class="success"/>
  <text x="64" y="516" fill="#6d5acd" font-size="14">📦</text>
  <text x="86" y="516" class="text-mono" font-size="13" font-weight="600">network-infra</text>
  <rect x="404" y="504" width="60" height="20" rx="6" class="badge-success"/>
  <text x="414" y="518" class="success" font-size="9" font-family="JetBrains Mono">running</text>
  <text x="86" y="538" class="text-muted" font-size="10">3 services • v5</text>

  <!-- Stack 4: dev (stopped) -->
  <rect x="40" y="566" width="440" height="70" rx="8" fill="transparent" stroke="#23233a"/>
  <text x="64" y="594" fill="#71717a" font-size="14">📦</text>
  <text x="86" y="594" class="text-mono" font-size="13" font-weight="600" fill="#71717a">dev-tools</text>
  <rect x="404" y="582" width="60" height="20" rx="6" class="badge-stopped"/>
  <text x="412" y="596" class="stopped" font-size="9" font-family="JetBrains Mono">stopped</text>
  <text x="86" y="616" class="text-muted" font-size="10">2 services • v1</text>

  <!-- Stack 5: game (failed) -->
  <rect x="40" y="644" width="440" height="70" rx="8" fill="transparent" stroke="#23233a"/>
  <rect x="40" y="644" width="4" height="70" rx="2" fill="#ef4444"/>
  <text x="64" y="672" fill="#ef4444" font-size="14">📦</text>
  <text x="86" y="672" class="text-mono" font-size="13" font-weight="600">game-servers</text>
  <rect x="404" y="660" width="50" height="20" rx="6" class="badge-failed"/>
  <text x="414" y="674" fill="#ef4444" font-size="9" font-family="JetBrains Mono">failed</text>
  <text x="86" y="694" class="text-muted" font-size="10">3 services • v4</text>

  <!-- Right Panel: Stack Detail -->
  <rect class="card" x="500" y="210" width="900" height="660"/>

  <!-- Detail header -->
  <text x="530" y="248" class="text-mono" font-size="24" font-weight="700">monitoring</text>
  <text x="530" y="268" class="text-muted" font-size="12">4 services • Version 3</text>

  <!-- Action buttons -->
  <rect x="1120" y="228" width="60" height="32" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1130" y="249" class="text-muted" font-size="11">⏹ Stop</text>
  <rect x="1190" y="228" width="76" height="32" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1200" y="249" class="text-muted" font-size="11">🔄 Restart</text>
  <rect x="1276" y="228" width="96" height="32" rx="6" class="accent-bg"/>
  <text x="1290" y="249" fill="#fff" font-size="11" font-family="Roboto">Edit Stack</text>

  <!-- Separator -->
  <line x1="530" y1="282" x2="1370" y2="282" stroke="#23233a"/>

  <!-- Sub-tabs -->
  <rect x="530" y="296" width="140" height="32" rx="6" fill="#1a1a2e"/>
  <text x="546" y="316" fill="#e4e4e7" font-size="12" font-family="Roboto">📄 docker-compose.yml</text>

  <text x="690" y="316" class="text-muted" font-size="12">📄 .env</text>
  <text x="760" y="316" class="text-muted" font-size="12">📁 Info</text>

  <!-- Edit / Save buttons -->
  <rect x="530" y="340" width="50" height="28" rx="6" class="accent-bg"/>
  <text x="543" y="358" fill="#fff" font-size="11" font-family="Roboto">Edit</text>

  <!-- Deploy / Update buttons -->
  <rect x="1186" y="340" width="68" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1196" y="358" class="text-muted" font-size="11">⬆ Update</text>
  <rect x="1262" y="340" width="68" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1272" y="358" class="text-muted" font-size="11">🚀 Deploy</text>

  <!-- Compose file content -->
  <rect x="530" y="378" width="840" height="470" rx="6" fill="#0a0a0f" stroke="#23233a"/>
  <text x="550" y="402" class="text-muted-mono" font-size="11">version: '3.8'</text>
  <text x="550" y="420" class="text-muted-mono" font-size="11"> </text>
  <text x="550" y="438" class="text-mono" font-size="11">services:</text>
  <text x="550" y="456" class="text-mono" font-size="11">  grafana:</text>
  <text x="550" y="474" class="text-muted-mono" font-size="11">    image: grafana/grafana:10.4</text>
  <text x="550" y="492" class="text-muted-mono" font-size="11">    ports:</text>
  <text x="550" y="510" fill="#22c55e" font-family="JetBrains Mono" font-size="11">      - "3000:3000"</text>
  <text x="550" y="528" class="text-muted-mono" font-size="11">    volumes:</text>
  <text x="550" y="546" class="text-muted-mono" font-size="11">      - grafana_data:/var/lib/grafana</text>
  <text x="550" y="564" class="text-muted-mono" font-size="11">    restart: unless-stopped</text>
  <text x="550" y="582" class="text-muted-mono" font-size="11"> </text>
  <text x="550" y="600" class="text-mono" font-size="11">  prometheus:</text>
  <text x="550" y="618" class="text-muted-mono" font-size="11">    image: prom/prometheus:v2.51</text>
  <text x="550" y="636" class="text-muted-mono" font-size="11">    ports:</text>
  <text x="550" y="654" fill="#22c55e" font-family="JetBrains Mono" font-size="11">      - "9090:9090"</text>
  <text x="550" y="672" class="text-muted-mono" font-size="11">    volumes:</text>
  <text x="550" y="690" class="text-muted-mono" font-size="11">      - ./prometheus.yml:/etc/prometheus/prometheus.yml</text>
  <text x="550" y="708" class="text-muted-mono" font-size="11">    restart: unless-stopped</text>
  <text x="550" y="726" class="text-muted-mono" font-size="11"> </text>
  <text x="550" y="744" class="text-mono" font-size="11">  alertmanager:</text>
  <text x="550" y="762" class="text-muted-mono" font-size="11">    image: prom/alertmanager:v0.27</text>
  <text x="550" y="780" class="text-muted-mono" font-size="11">    ports:</text>
  <text x="550" y="798" fill="#22c55e" font-family="JetBrains Mono" font-size="11">      - "9093:9093"</text>

  <text x="1350" y="880" class="text-muted" font-size="10" text-anchor="end">HLC — Stacks</text>
</svg>
