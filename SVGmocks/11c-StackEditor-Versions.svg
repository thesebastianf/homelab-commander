<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
      .card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <rect class="dialog" x="80" y="20" width="1280" height="860"/>

  <!-- Header -->
  <text x="120" y="58" class="text-mono" font-size="20" font-weight="700">✏️ Edit Stack — monitoring</text>
  <text x="120" y="78" class="text-muted" font-size="12">Modify compose configuration, environment, and stack settings</text>
  <text x="1320" y="56" class="text-muted" font-size="20">✕</text>

  <!-- Paths -->
  <text x="120" y="102" class="text-muted" font-size="10">📁 /opt/stacks/monitoring 📋  💽 /mnt/docker-volumes/monitoring 📋</text>

  <!-- 5 Tabs — Versions active -->
  <rect x="120" y="120" width="1200" height="1" fill="#23233a"/>
  <text x="128" y="142" class="text-muted-mono" font-size="11">docker-compose.yml</text>
  <text x="264" y="142" class="text-muted-mono" font-size="11">.env</text>
  <text x="310" y="142" class="text-muted-mono" font-size="11">GitHub Sync</text>
  <rect x="412" y="120" width="62" height="2" fill="#6d5acd"/>
  <text x="418" y="142" class="text-mono" font-size="11" font-weight="500" fill="#e4e4e7">Versions</text>
  <text x="490" y="142" class="text-muted-mono" font-size="11">Compare</text>

  <!-- Version History -->
  <text x="120" y="172" class="text-mono" font-size="14" font-weight="600">Version History</text>
  <text x="120" y="190" class="text-muted" font-size="11">Track changes over time. Restore any previous version.</text>

  <!-- Version 5 (current) -->
  <rect class="card" x="120" y="208" width="1200" height="90"/>
  <rect x="120" y="208" width="4" height="90" rx="2" fill="#6d5acd"/>
  <rect x="150" y="222" width="30" height="20" rx="6" fill="rgba(109,90,205,0.15)" stroke="rgba(109,90,205,0.3)"/>
  <text x="158" y="236" fill="#6d5acd" font-size="10" font-family="JetBrains Mono">v5</text>
  <rect x="186" y="222" width="54" height="20" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)"/>
  <text x="194" y="236" fill="#22c55e" font-size="10" font-family="JetBrains Mono">Current</text>
  <text x="256" y="236" class="text-mono" font-size="12" font-weight="500">Added alertmanager service</text>
  <text x="150" y="260" class="text-muted" font-size="10">January 15, 2024 at 14:30</text>
  <rect x="1170" y="224" width="110" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1190" y="242" class="text-muted" font-size="10">📊 Compare</text>

  <!-- Version 4 -->
  <rect class="card" x="120" y="312" width="1200" height="90"/>
  <rect x="150" y="326" width="30" height="20" rx="6" fill="rgba(113,113,122,0.15)" stroke="#23233a"/>
  <text x="158" y="340" class="text-muted-mono" font-size="10">v4</text>
  <text x="196" y="340" class="text-mono" font-size="12" font-weight="500">Updated Prometheus to v2.51.0</text>
  <text x="150" y="364" class="text-muted" font-size="10">January 12, 2024 at 09:15</text>
  <rect x="1060" y="328" width="110" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1080" y="346" class="text-muted" font-size="10">📊 Compare</text>
  <rect x="1180" y="328" width="100" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1198" y="346" class="text-muted" font-size="10">↩ Restore</text>

  <!-- Version 3 -->
  <rect class="card" x="120" y="416" width="1200" height="90"/>
  <rect x="150" y="430" width="30" height="20" rx="6" fill="rgba(113,113,122,0.15)" stroke="#23233a"/>
  <text x="158" y="444" class="text-muted-mono" font-size="10">v3</text>
  <text x="196" y="444" class="text-mono" font-size="12" font-weight="500">Added Grafana environment variables</text>
  <text x="150" y="468" class="text-muted" font-size="10">January 10, 2024 at 16:45</text>
  <rect x="1060" y="432" width="110" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1080" y="450" class="text-muted" font-size="10">📊 Compare</text>
  <rect x="1180" y="432" width="100" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1198" y="450" class="text-muted" font-size="10">↩ Restore</text>

  <!-- Version 2 -->
  <rect class="card" x="120" y="520" width="1200" height="90"/>
  <rect x="150" y="534" width="30" height="20" rx="6" fill="rgba(113,113,122,0.15)" stroke="#23233a"/>
  <text x="158" y="548" class="text-muted-mono" font-size="10">v2</text>
  <text x="196" y="548" class="text-mono" font-size="12" font-weight="500">Added monitoring_net network</text>
  <text x="150" y="572" class="text-muted" font-size="10">January 8, 2024 at 11:20</text>
  <rect x="1060" y="536" width="110" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1080" y="554" class="text-muted" font-size="10">📊 Compare</text>
  <rect x="1180" y="536" width="100" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1198" y="554" class="text-muted" font-size="10">↩ Restore</text>

  <!-- Version 1 -->
  <rect class="card" x="120" y="624" width="1200" height="90"/>
  <rect x="150" y="638" width="30" height="20" rx="6" fill="rgba(113,113,122,0.15)" stroke="#23233a"/>
  <text x="158" y="652" class="text-muted-mono" font-size="10">v1</text>
  <text x="196" y="652" class="text-mono" font-size="12" font-weight="500">Initial stack creation</text>
  <text x="150" y="676" class="text-muted" font-size="10">January 5, 2024 at 20:00</text>
  <rect x="1060" y="640" width="110" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1080" y="658" class="text-muted" font-size="10">📊 Compare</text>
  <rect x="1180" y="640" width="100" height="28" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1198" y="658" class="text-muted" font-size="10">↩ Restore</text>

  <!-- Footer -->
  <rect x="120" y="758" width="1200" height="1" fill="#23233a"/>
  <rect x="120" y="778" width="80" height="36" rx="8" stroke="#23233a" fill="transparent"/>
  <text x="138" y="801" class="text-muted" font-size="12">Cancel</text>
  <rect x="1220" y="778" width="120" height="36" rx="8" fill="#6d5acd"/>
  <text x="1238" y="801" fill="#fff" font-family="Roboto" font-size="12" font-weight="500">Save Changes</text>

  <text x="1320" y="868" class="text-muted" font-size="9" text-anchor="end">HLC — Enhanced Stack Editor (Versions Tab)</text>
</svg>
