<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
      .tab-active-bar { fill: #6d5acd; }
      .section-card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <!-- Dialog -->
  <rect class="dialog" x="220" y="30" width="1000" height="840"/>

  <!-- Dialog Header -->
  <text x="260" y="72" class="text-mono" font-size="20" font-weight="700">⚙️ Settings</text>
  <text x="260" y="92" class="text-muted" font-size="12">Configure your homelab command center preferences</text>
  <text x="1180" y="70" class="text-muted" font-size="20" style="cursor:pointer">✕</text>

  <!-- Tabs -->
  <rect x="260" y="112" width="940" height="40" rx="8" fill="#0a0a0f" stroke="#23233a"/>
  <rect x="262" y="114" width="140" height="36" rx="7" fill="#1a1a2e"/>
  <text x="292" y="137" fill="#e4e4e7" font-family="Roboto" font-size="12" font-weight="500">📁 General</text>
  <text x="452" y="137" class="text-muted" font-size="12">🔔 Notifications</text>
  <text x="592" y="137" class="text-muted" font-size="12">🔗 Integrations</text>

  <!-- ========== GENERAL TAB CONTENT ========== -->

  <!-- Stacks Base Path -->
  <text x="260" y="184" class="text-mono" font-size="12" font-weight="500">Stacks Base Path</text>
  <rect class="input-bg" x="260" y="192" width="920" height="36"/>
  <text x="276" y="215" class="text-mono" font-size="12">/opt/stacks</text>
  <text x="260" y="244" class="text-muted" font-size="10">Base directory where stack folders will be created. Each stack gets its own subfolder.</text>

  <!-- Named Volumes Base Path -->
  <text x="260" y="272" class="text-mono" font-size="12" font-weight="500">Named Volumes Base Path</text>
  <rect class="input-bg" x="260" y="280" width="920" height="36"/>
  <text x="276" y="303" class="text-mono" font-size="12">/mnt/docker-volumes</text>
  <text x="260" y="332" class="text-muted" font-size="10">Base directory for named volumes. Each stack gets its own volume subfolder.</text>

  <!-- Backups Base Path -->
  <text x="260" y="360" class="text-mono" font-size="12" font-weight="500">Backups Base Path</text>
  <rect class="input-bg" x="260" y="368" width="920" height="36"/>
  <text x="276" y="391" class="text-mono" font-size="12">/mnt/backups</text>
  <text x="260" y="420" class="text-muted" font-size="10">Base directory where stack backups will be stored. NAS can pull from this location.</text>

  <!-- Separator -->
  <rect x="260" y="440" width="940" height="1" fill="#23233a"/>

  <!-- Update Management Section -->
  <text x="260" y="470" class="text-mono" font-size="14" font-weight="600">⚡ Update Management</text>

  <!-- Global Update Freeze Card -->
  <rect class="section-card" x="260" y="486" width="920" height="90"/>
  <!-- Red border when enabled -->
  <rect x="260" y="486" width="4" height="90" rx="2" fill="#ef4444"/>
  <text x="296" y="514" class="text-mono" font-size="13" font-weight="600">❄️ Global Update Freeze</text>
  <rect x="500" y="500" width="62" height="20" rx="6" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.3)"/>
  <text x="510" y="514" fill="#ef4444" font-size="10" font-family="JetBrains Mono">FROZEN</text>
  <text x="296" y="536" class="text-muted" font-size="11">Disable ALL container updates for maximum stability. Useful</text>
  <text x="296" y="552" class="text-muted" font-size="11">during vacation or critical periods.</text>
  <!-- Toggle ON -->
  <rect x="1100" y="506" width="40" height="22" rx="11" fill="#6d5acd"/>
  <circle cx="1130" cy="517" r="8" fill="#fff"/>

  <!-- Automatic Container Updates Card -->
  <rect class="section-card" x="260" y="590" width="920" height="80"/>
  <text x="296" y="618" class="text-mono" font-size="13" font-weight="600">🔄 Automatic Container Updates</text>
  <text x="296" y="640" class="text-muted" font-size="11">Automatically update containers when new images are available</text>
  <!-- Toggle OFF (disabled because freeze is on) -->
  <rect x="1100" y="610" width="40" height="22" rx="11" fill="#23233a" opacity="0.5"/>
  <circle cx="1112" cy="621" r="8" fill="#71717a" opacity="0.5"/>

  <!-- Footer -->
  <rect x="260" y="698" width="940" height="1" fill="#23233a"/>
  <rect x="980" y="718" width="80" height="36" rx="8" stroke="#23233a" fill="transparent"/>
  <text x="998" y="741" class="text-muted" font-size="12">Cancel</text>
  <rect x="1080" y="718" width="120" height="36" rx="8" fill="#3b82f6"/>
  <text x="1098" y="741" fill="#fff" font-family="Roboto" font-size="12" font-weight="500">Save Changes</text>

  <text x="1180" y="858" class="text-muted" font-size="9" text-anchor="end">HLC — Settings Dialog (General Tab)</text>
</svg>
