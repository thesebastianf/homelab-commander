<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
      .code-bg { fill: #080810; stroke: #23233a; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <rect class="dialog" x="80" y="20" width="1280" height="860"/>

  <!-- Header -->
  <text x="120" y="58" class="text-mono" font-size="20" font-weight="700">✏️ Edit Stack — monitoring</text>
  <text x="120" y="78" class="text-muted" font-size="12">Modify compose configuration, environment, and stack settings</text>
  <text x="1320" y="56" class="text-muted" font-size="20">✕</text>

  <!-- Stack Path + Volume Path -->
  <text x="120" y="102" class="text-muted" font-size="10">📁 Stack Path:</text>
  <text x="206" y="102" class="text-muted-mono" font-size="10">/opt/stacks/monitoring</text>
  <text x="386" y="102" fill="#3b82f6" font-size="10" font-family="Roboto">📋</text>
  <text x="430" y="102" class="text-muted" font-size="10">💽 Volume Path:</text>
  <text x="528" y="102" class="text-muted-mono" font-size="10">/mnt/docker-volumes/monitoring</text>
  <text x="758" y="102" fill="#3b82f6" font-size="10" font-family="Roboto">📋</text>

  <!-- Port Conflict Alert -->
  <rect x="120" y="112" width="1200" height="32" rx="8" fill="rgba(34,197,94,0.04)" stroke="rgba(34,197,94,0.2)"/>
  <text x="146" y="133" fill="#22c55e" font-family="Roboto" font-size="10">✓ No port conflicts detected</text>

  <!-- 5 Tabs -->
  <rect x="120" y="156" width="1200" height="1" fill="#23233a"/>
  <rect x="120" y="156" width="120" height="2" fill="#6d5acd"/>
  <text x="128" y="178" class="text-mono" font-size="11" font-weight="500" fill="#e4e4e7">docker-compose.yml</text>
  <text x="270" y="178" class="text-muted-mono" font-size="11">.env</text>
  <text x="320" y="178" class="text-muted-mono" font-size="11">GitHub Sync</text>
  <text x="420" y="178" class="text-muted-mono" font-size="11">Versions</text>
  <text x="500" y="178" class="text-muted-mono" font-size="11">Compare</text>

  <!-- Version save row -->
  <rect class="input-bg" x="120" y="192" width="320" height="28"/>
  <text x="136" y="211" class="text-muted-mono" font-size="10">Version description (optional)</text>
  <rect x="450" y="192" width="100" height="28" rx="6" fill="rgba(109,90,205,0.15)" stroke="rgba(109,90,205,0.4)"/>
  <text x="460" y="211" fill="#6d5acd" font-family="Roboto" font-size="10">Save Version</text>

  <!-- Right-click badge -->
  <rect x="120" y="226" width="180" height="18" rx="4" fill="rgba(59,130,246,0.08)"/>
  <text x="130" y="239" fill="#3b82f6" font-size="9" font-family="Roboto">💡 Right-click to insert paths</text>

  <!-- Compose Editor -->
  <rect class="code-bg" x="120" y="250" width="1200" height="498"/>

  <!-- Code content -->
  <text x="136" y="274" class="text-muted-mono" font-size="10"> 1</text>
  <text x="170" y="274" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">version:</text>
  <text x="230" y="274" fill="#22c55e" font-family="JetBrains Mono" font-size="10">"3.8"</text>
  <text x="136" y="290" class="text-muted-mono" font-size="10"> 2</text>
  <text x="136" y="306" class="text-muted-mono" font-size="10"> 3</text>
  <text x="170" y="306" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">services:</text>
  <text x="136" y="322" class="text-muted-mono" font-size="10"> 4</text>
  <text x="170" y="322" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">  grafana:</text>
  <text x="136" y="338" class="text-muted-mono" font-size="10"> 5</text>
  <text x="170" y="338" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    image:</text>
  <text x="220" y="338" fill="#22c55e" font-family="JetBrains Mono" font-size="10">grafana/grafana:10.4.0</text>
  <text x="136" y="354" class="text-muted-mono" font-size="10"> 6</text>
  <text x="170" y="354" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    container_name:</text>
  <text x="310" y="354" fill="#22c55e" font-family="JetBrains Mono" font-size="10">grafana</text>
  <text x="136" y="370" class="text-muted-mono" font-size="10"> 7</text>
  <text x="170" y="370" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    ports:</text>
  <text x="136" y="386" class="text-muted-mono" font-size="10"> 8</text>
  <text x="170" y="386" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - "3000:3000"</text>
  <text x="136" y="402" class="text-muted-mono" font-size="10"> 9</text>
  <text x="170" y="402" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    volumes:</text>
  <text x="136" y="418" class="text-muted-mono" font-size="10">10</text>
  <text x="170" y="418" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - grafana_data:/var/lib/grafana</text>
  <text x="136" y="434" class="text-muted-mono" font-size="10">11</text>
  <text x="170" y="434" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    environment:</text>
  <text x="136" y="450" class="text-muted-mono" font-size="10">12</text>
  <text x="170" y="450" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASS}</text>
  <text x="136" y="466" class="text-muted-mono" font-size="10">13</text>
  <text x="170" y="466" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    networks:</text>
  <text x="136" y="482" class="text-muted-mono" font-size="10">14</text>
  <text x="170" y="482" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - monitoring_net</text>
  <text x="136" y="498" class="text-muted-mono" font-size="10">15</text>
  <text x="170" y="498" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    restart:</text>
  <text x="230" y="498" fill="#22c55e" font-family="JetBrains Mono" font-size="10">unless-stopped</text>
  <text x="136" y="514" class="text-muted-mono" font-size="10">16</text>
  <text x="136" y="530" class="text-muted-mono" font-size="10">17</text>
  <text x="170" y="530" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">  prometheus:</text>
  <text x="136" y="546" class="text-muted-mono" font-size="10">18</text>
  <text x="170" y="546" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    image:</text>
  <text x="220" y="546" fill="#22c55e" font-family="JetBrains Mono" font-size="10">prom/prometheus:v2.51.0</text>
  <text x="136" y="562" class="text-muted-mono" font-size="10">19</text>
  <text x="170" y="562" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    container_name:</text>
  <text x="310" y="562" fill="#22c55e" font-family="JetBrains Mono" font-size="10">prometheus</text>
  <text x="136" y="578" class="text-muted-mono" font-size="10">20</text>
  <text x="170" y="578" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    ports:</text>
  <text x="136" y="594" class="text-muted-mono" font-size="10">21</text>
  <text x="170" y="594" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - "9090:9090"</text>
  <text x="136" y="610" class="text-muted-mono" font-size="10">22</text>
  <text x="170" y="610" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    volumes:</text>
  <text x="136" y="626" class="text-muted-mono" font-size="10">23</text>
  <text x="170" y="626" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - prometheus_data:/prometheus</text>
  <text x="136" y="642" class="text-muted-mono" font-size="10">24</text>
  <text x="170" y="642" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - ./prometheus.yml:/etc/prometheus/prometheus.yml</text>
  <text x="136" y="658" class="text-muted-mono" font-size="10">25</text>
  <text x="170" y="658" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    networks:</text>
  <text x="136" y="674" class="text-muted-mono" font-size="10">26</text>
  <text x="170" y="674" fill="#22c55e" font-family="JetBrains Mono" font-size="10">      - monitoring_net</text>
  <text x="136" y="690" class="text-muted-mono" font-size="10">27</text>
  <text x="170" y="690" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    restart:</text>
  <text x="230" y="690" fill="#22c55e" font-family="JetBrains Mono" font-size="10">unless-stopped</text>
  <text x="136" y="706" class="text-muted-mono" font-size="10">28</text>
  <text x="136" y="722" class="text-muted-mono" font-size="10">29</text>
  <text x="170" y="722" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">  alertmanager:</text>
  <text x="136" y="738" class="text-muted-mono" font-size="10">30</text>
  <text x="170" y="738" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">    image:</text>
  <text x="220" y="738" fill="#22c55e" font-family="JetBrains Mono" font-size="10">prom/alertmanager:v0.27.0</text>

  <!-- Footer -->
  <rect x="120" y="768" width="1200" height="1" fill="#23233a"/>
  <rect x="120" y="788" width="80" height="36" rx="8" stroke="#23233a" fill="transparent"/>
  <text x="138" y="811" class="text-muted" font-size="12">Cancel</text>
  <rect x="1220" y="788" width="120" height="36" rx="8" fill="#6d5acd"/>
  <text x="1238" y="811" fill="#fff" font-family="Roboto" font-size="12" font-weight="500">Save Changes</text>

  <text x="1320" y="868" class="text-muted" font-size="9" text-anchor="end">HLC — Enhanced Stack Editor (Compose Tab)</text>
</svg>
