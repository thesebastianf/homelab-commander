<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
      .card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <rect class="dialog" x="80" y="20" width="1280" height="860"/>

  <!-- Header -->
  <text x="120" y="58" class="text-mono" font-size="20" font-weight="700">✏️ Edit Stack — monitoring</text>
  <text x="120" y="78" class="text-muted" font-size="12">Modify compose configuration, environment, and stack settings</text>
  <text x="1320" y="56" class="text-muted" font-size="20">✕</text>

  <!-- Paths -->
  <text x="120" y="102" class="text-muted" font-size="10">📁 /opt/stacks/monitoring 📋  💽 /mnt/docker-volumes/monitoring 📋</text>

  <!-- 5 Tabs — GitHub Sync active -->
  <rect x="120" y="120" width="1200" height="1" fill="#23233a"/>
  <text x="128" y="142" class="text-muted-mono" font-size="11">docker-compose.yml</text>
  <text x="264" y="142" class="text-muted-mono" font-size="11">.env</text>
  <rect x="304" y="120" width="90" height="2" fill="#6d5acd"/>
  <text x="310" y="142" class="text-mono" font-size="11" font-weight="500" fill="#e4e4e7">GitHub Sync</text>
  <text x="418" y="142" class="text-muted-mono" font-size="11">Versions</text>
  <text x="490" y="142" class="text-muted-mono" font-size="11">Compare</text>

  <!-- GitHub Sync Content -->
  <text x="120" y="178" class="text-mono" font-size="14" font-weight="600">🔗 GitHub Repository Sync</text>
  <text x="120" y="198" class="text-muted" font-size="11">Sync your compose configuration with a Git repository</text>

  <!-- Enable toggle -->
  <text x="120" y="234" class="text-muted" font-size="11">Enable GitHub Sync</text>
  <rect x="260" y="220" width="40" height="22" rx="11" fill="#6d5acd"/>
  <circle cx="290" cy="231" r="8" fill="#fff"/>

  <rect x="120" y="254" width="1200" height="1" fill="#23233a"/>

  <!-- Repository URL -->
  <text x="120" y="284" class="text-muted" font-size="11">Repository URL</text>
  <rect class="input-bg" x="120" y="292" width="600" height="34"/>
  <text x="136" y="314" class="text-mono" font-size="11">https://github.com/username/homelab-stacks.git</text>

  <!-- Branch -->
  <text x="740" y="284" class="text-muted" font-size="11">Branch</text>
  <rect class="input-bg" x="740" y="292" width="200" height="34"/>
  <text x="756" y="314" class="text-mono" font-size="11">main</text>

  <!-- Compose File Path -->
  <text x="120" y="348" class="text-muted" font-size="11">Compose File Path</text>
  <rect class="input-bg" x="120" y="356" width="400" height="34"/>
  <text x="136" y="378" class="text-mono" font-size="11">docker-compose.yml</text>

  <!-- Auto-Sync -->
  <text x="560" y="348" class="text-muted" font-size="11">Auto-Sync</text>
  <rect x="560" y="362" width="40" height="22" rx="11" fill="#23233a"/>
  <circle cx="572" cy="373" r="8" fill="#71717a"/>
  <text x="610" y="378" class="text-muted" font-size="10">Pull changes automatically</text>

  <rect x="120" y="406" width="1200" height="1" fill="#23233a"/>

  <!-- Sync Status -->
  <text x="120" y="438" class="text-mono" font-size="13" font-weight="600">Sync Status</text>
  <rect class="card" x="120" y="452" width="1200" height="80"/>
  <text x="150" y="478" class="text-muted" font-size="11">Last Synced:</text>
  <text x="232" y="478" class="text-mono" font-size="11">January 15, 2024 14:30:12</text>
  <text x="150" y="500" class="text-muted" font-size="11">Status:</text>
  <rect x="196" y="488" width="54" height="18" rx="4" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)"/>
  <text x="206" y="502" fill="#22c55e" font-size="9" font-family="JetBrains Mono">In Sync</text>
  <text x="270" y="500" class="text-muted" font-size="11">Commit: abc123f — "Update prometheus config"</text>

  <!-- Action buttons -->
  <rect x="1060" y="464" width="110" height="32" rx="6" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.4)"/>
  <text x="1076" y="485" fill="#3b82f6" font-family="Roboto" font-size="11">🔄 Sync Now</text>
  <rect x="1180" y="464" width="120" height="32" rx="6" fill="rgba(109,90,205,0.12)" stroke="rgba(109,90,205,0.4)"/>
  <text x="1196" y="485" fill="#6d5acd" font-family="Roboto" font-size="11">📤 Push Changes</text>

  <!-- Footer -->
  <rect x="120" y="758" width="1200" height="1" fill="#23233a"/>
  <rect x="120" y="778" width="80" height="36" rx="8" stroke="#23233a" fill="transparent"/>
  <text x="138" y="801" class="text-muted" font-size="12">Cancel</text>
  <rect x="1220" y="778" width="120" height="36" rx="8" fill="#6d5acd"/>
  <text x="1238" y="801" fill="#fff" font-family="Roboto" font-size="12" font-weight="500">Save Changes</text>

  <text x="1320" y="868" class="text-muted" font-size="9" text-anchor="end">HLC — Enhanced Stack Editor (GitHub Sync Tab)</text>
</svg>
