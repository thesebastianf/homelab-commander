<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-body { fill: #e4e4e7; font-family: 'Roboto', sans-serif; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <!-- Dialog Panel -->
  <rect class="dialog" x="200" y="30" width="1040" height="840"/>

  <!-- Header -->
  <text x="240" y="70" class="text-mono" font-size="20" font-weight="700">🔔 Notification Services</text>
  <text x="240" y="92" class="text-muted" font-size="12">Configure external services to receive alerts and notifications</text>
  <text x="1200" y="68" class="text-muted" font-size="20" style="cursor:pointer">✕</text>

  <!-- Add Service Row -->
  <text x="240" y="124" class="text-mono" font-size="12" font-weight="500">Add Service</text>
  <rect x="340" y="108" width="180" height="30" rx="6" fill="#0a0a0f" stroke="#23233a"/>
  <text x="356" y="128" class="text-muted" font-size="11">📱 Telegram</text>
  <text x="498" y="128" class="text-muted" font-size="10">▾</text>
  <!-- Dropdown hint: Telegram | Discord | Slack | Email | Webhook -->

  <rect x="530" y="108" width="120" height="30" rx="6" fill="#6d5acd"/>
  <text x="558" y="128" fill="#fff" font-family="Roboto" font-size="11" font-weight="500">+ Add Service</text>

  <rect x="240" y="150" width="960" height="1" fill="#23233a"/>

  <!-- Service 1: Telegram (Expanded, Enabled) -->
  <rect class="card" x="240" y="164" width="960" height="190"/>
  <rect x="240" y="164" width="6" height="190" rx="3" fill="#3b82f6"/>

  <!-- Service header -->
  <text x="272" y="194" class="text-mono" font-size="14" font-weight="600">Server Alerts</text>
  <rect x="392" y="180" width="64" height="18" rx="4" fill="rgba(59,130,246,0.1)"/>
  <text x="402" y="193" fill="#3b82f6" font-size="9" font-family="JetBrains Mono">Telegram</text>
  <!-- Enabled toggle ON -->
  <rect x="1060" y="182" width="36" height="18" rx="9" fill="#22c55e"/>
  <circle cx="1082" cy="191" r="6" fill="#fff"/>
  <text x="1108" y="193" fill="#22c55e" font-size="10" font-family="Roboto">Enabled</text>
  <!-- Delete -->
  <text x="1170" y="193" class="text-muted" font-size="14" style="cursor:pointer">🗑</text>

  <!-- Telegram Config -->
  <text x="272" y="224" class="text-muted" font-size="10">Bot Token</text>
  <rect class="input-bg" x="272" y="230" width="440" height="28"/>
  <text x="284" y="249" class="text-muted-mono" font-size="10">••••••••••:AAHf3k9...</text>

  <text x="272" y="278" class="text-muted" font-size="10">Chat ID</text>
  <rect class="input-bg" x="272" y="284" width="200" height="28"/>
  <text x="284" y="303" class="text-mono" font-size="10">-1001234567890</text>

  <rect x="510" y="284" width="80" height="28" rx="6" stroke="#3b82f6" fill="transparent"/>
  <text x="524" y="303" fill="#3b82f6" font-family="Roboto" font-size="10">🔔 Test</text>

  <!-- Status indicator -->
  <rect x="272" y="328" width="80" height="18" rx="4" fill="rgba(34,197,94,0.08)"/>
  <text x="282" y="341" fill="#22c55e" font-size="9" font-family="Roboto">✓ Connected</text>
  <text x="362" y="341" class="text-muted" font-size="9">Last sent: 2 hours ago</text>

  <!-- Service 2: Discord (Expanded, Enabled) -->
  <rect class="card" x="240" y="368" width="960" height="165"/>
  <rect x="240" y="368" width="6" height="165" rx="3" fill="#6d5acd"/>

  <text x="272" y="398" class="text-mono" font-size="14" font-weight="600">DevOps Channel</text>
  <rect x="404" y="384" width="56" height="18" rx="4" fill="rgba(109,90,205,0.1)"/>
  <text x="414" y="397" fill="#6d5acd" font-size="9" font-family="JetBrains Mono">Discord</text>
  <rect x="1060" y="386" width="36" height="18" rx="9" fill="#22c55e"/>
  <circle cx="1082" cy="395" r="6" fill="#fff"/>
  <text x="1108" y="397" fill="#22c55e" font-size="10" font-family="Roboto">Enabled</text>
  <text x="1170" y="397" class="text-muted" font-size="14" style="cursor:pointer">🗑</text>

  <!-- Discord Config -->
  <text x="272" y="428" class="text-muted" font-size="10">Webhook URL</text>
  <rect class="input-bg" x="272" y="434" width="700" height="28"/>
  <text x="284" y="453" class="text-muted-mono" font-size="10">https://discord.com/api/webhooks/1234567890/AbCdEf...</text>

  <rect x="510" y="476" width="80" height="28" rx="6" stroke="#6d5acd" fill="transparent"/>
  <text x="524" y="495" fill="#6d5acd" font-family="Roboto" font-size="10">🔔 Test</text>

  <rect x="272" y="507" width="80" height="18" rx="4" fill="rgba(34,197,94,0.08)"/>
  <text x="282" y="520" fill="#22c55e" font-size="9" font-family="Roboto">✓ Connected</text>
  <text x="362" y="520" class="text-muted" font-size="9">Last sent: yesterday</text>

  <!-- Service 3: Email (Expanded, Disabled) -->
  <rect x="240" y="546" width="960" height="220" rx="10" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="4 2"/>
  <rect x="240" y="546" width="6" height="220" rx="3" fill="#71717a"/>

  <text x="272" y="576" class="text-mono" font-size="14" font-weight="600" fill="#71717a">Admin Email</text>
  <rect x="378" y="562" width="44" height="18" rx="4" fill="rgba(113,113,122,0.1)"/>
  <text x="388" y="575" fill="#71717a" font-size="9" font-family="JetBrains Mono">Email</text>
  <rect x="1060" y="564" width="36" height="18" rx="9" fill="#23233a"/>
  <circle cx="1073" cy="573" r="6" fill="#71717a"/>
  <text x="1108" y="575" fill="#71717a" font-size="10" font-family="Roboto">Disabled</text>
  <text x="1170" y="575" class="text-muted" font-size="14" style="cursor:pointer">🗑</text>

  <!-- Email Config -->
  <text x="272" y="606" fill="#71717a" font-size="10" font-family="Roboto">SMTP Host</text>
  <rect x="272" y="612" width="200" height="26" rx="6" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="2"/>
  <text x="284" y="630" fill="#52525b" font-size="10" font-family="JetBrains Mono">smtp.gmail.com</text>

  <text x="484" y="606" fill="#71717a" font-size="10" font-family="Roboto">SMTP Port</text>
  <rect x="484" y="612" width="80" height="26" rx="6" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="2"/>
  <text x="496" y="630" fill="#52525b" font-size="10" font-family="JetBrains Mono">587</text>

  <text x="580" y="606" fill="#71717a" font-size="10" font-family="Roboto">Username</text>
  <rect x="580" y="612" width="200" height="26" rx="6" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="2"/>
  <text x="592" y="630" fill="#52525b" font-size="10" font-family="JetBrains Mono">admin@example.com</text>

  <text x="272" y="656" fill="#71717a" font-size="10" font-family="Roboto">Password</text>
  <rect x="272" y="662" width="200" height="26" rx="6" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="2"/>
  <text x="284" y="680" fill="#52525b" font-size="10" font-family="JetBrains Mono">••••••••</text>

  <text x="484" y="656" fill="#71717a" font-size="10" font-family="Roboto">From Address</text>
  <rect x="484" y="662" width="200" height="26" rx="6" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="2"/>
  <text x="496" y="680" fill="#52525b" font-size="10" font-family="JetBrains Mono">hlc@example.com</text>

  <text x="700" y="656" fill="#71717a" font-size="10" font-family="Roboto">To Address</text>
  <rect x="700" y="662" width="200" height="26" rx="6" fill="#0a0a0f" stroke="#23233a" stroke-dasharray="2"/>
  <text x="712" y="680" fill="#52525b" font-size="10" font-family="JetBrains Mono">admin@example.com</text>

  <rect x="272" y="700" width="80" height="18" rx="4" fill="rgba(113,113,122,0.08)"/>
  <text x="280" y="713" fill="#71717a" font-size="9" font-family="Roboto">○ Not tested</text>

  <!-- Service 4: Webhook (Collapsed teaser) -->
  <rect class="card" x="240" y="780" width="960" height="46"/>
  <rect x="240" y="780" width="6" height="46" rx="3" fill="#f59e0b"/>
  <text x="272" y="808" class="text-mono" font-size="14" font-weight="600">Build Webhook</text>
  <rect x="390" y="794" width="62" height="18" rx="4" fill="rgba(245,158,11,0.1)"/>
  <text x="400" y="807" fill="#f59e0b" font-size="9" font-family="JetBrains Mono">Webhook</text>
  <rect x="460" y="794" width="110" height="18" rx="4" fill="rgba(113,113,122,0.08)"/>
  <text x="470" y="807" class="text-muted-mono" font-size="9">POST https://...</text>
  <rect x="1060" y="796" width="36" height="18" rx="9" fill="#22c55e"/>
  <circle cx="1082" cy="805" r="6" fill="#fff"/>
  <text x="1108" y="807" fill="#22c55e" font-size="10" font-family="Roboto">Enabled</text>
  <text x="1170" y="807" class="text-muted" font-size="14" style="cursor:pointer">🗑</text>

  <!-- Footer -->
  <rect x="240" y="838" width="960" height="1" fill="#23233a"/>
  <text x="240" y="858" class="text-muted" font-size="10">4 services configured · 3 enabled · 1 disabled</text>
  <rect x="1060" y="840" width="140" height="28" rx="6" fill="#6d5acd"/>
  <text x="1094" y="859" fill="#fff" font-family="Roboto" font-size="11" font-weight="500">Save Services</text>
</svg>
