<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
      .code-bg { fill: #080810; stroke: #23233a; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <rect class="dialog" x="120" y="10" width="1200" height="880"/>

  <!-- Header -->
  <text x="160" y="48" class="text-mono" font-size="20" font-weight="700">💾 Backup Management</text>
  <text x="160" y="68" class="text-muted" font-size="12">Configure automated backups for stacks and volumes</text>
  <text x="1280" y="46" class="text-muted" font-size="20">✕</text>

  <!-- Tabs — Settings active -->
  <rect x="160" y="82" width="1120" height="1" fill="#23233a"/>
  <text x="168" y="104" class="text-muted-mono" font-size="11">Stack Backups</text>
  <text x="296" y="104" class="text-muted-mono" font-size="11">Backup History</text>
  <rect x="416" y="82" width="66" height="2" fill="#6d5acd"/>
  <text x="422" y="104" class="text-mono" font-size="11" font-weight="500" fill="#e4e4e7">Settings</text>

  <!-- Backup Storage Path -->
  <text x="160" y="140" class="text-mono" font-size="14" font-weight="600">Backup Storage Path</text>
  <rect class="input-bg" x="160" y="152" width="500" height="34"/>
  <text x="176" y="174" class="text-mono" font-size="11">/mnt/backups</text>
  <rect x="670" y="152" width="60" height="34" rx="6" fill="#6d5acd"/>
  <text x="684" y="174" fill="#fff" font-family="Roboto" font-size="11">Save</text>

  <!-- NAS Tip -->
  <rect x="160" y="202" width="1120" height="50" rx="8" fill="rgba(59,130,246,0.04)" stroke="rgba(59,130,246,0.2)"/>
  <text x="186" y="224" fill="#3b82f6" font-family="Roboto" font-size="11">💡 Tip: Mount your NAS share to this path. HLC will store backups here, and your NAS</text>
  <text x="186" y="240" fill="#3b82f6" font-family="Roboto" font-size="11">can pull them on its own schedule for offsite redundancy.</text>

  <rect x="160" y="270" width="1120" height="1" fill="#23233a"/>

  <!-- Backup Directory Structure -->
  <text x="160" y="300" class="text-mono" font-size="14" font-weight="600">Backup Directory Structure</text>
  <rect class="code-bg" x="160" y="312" width="600" height="220"/>
  <text x="176" y="336" class="text-muted-mono" font-size="10">/mnt/backups/</text>
  <text x="176" y="356" class="text-muted-mono" font-size="10">├── web-stack/</text>
  <text x="176" y="376" class="text-muted-mono" font-size="10">│   ├── 2024-01-15_020000/</text>
  <text x="176" y="396" class="text-muted-mono" font-size="10">│   │   ├── stack/          (compose + env)</text>
  <text x="176" y="416" class="text-muted-mono" font-size="10">│   │   ├── volumes/        (volume data)</text>
  <text x="176" y="436" class="text-muted-mono" font-size="10">│   │   ├── database/       (SQL dump)</text>
  <text x="176" y="456" class="text-muted-mono" font-size="10">│   │   └── manifest.json</text>
  <text x="176" y="476" class="text-muted-mono" font-size="10">│   └── 2024-01-14_020000/</text>
  <text x="176" y="496" class="text-muted-mono" font-size="10">├── database-stack/</text>
  <text x="176" y="516" class="text-muted-mono" font-size="10">└── monitoring-stack/</text>

  <rect x="160" y="550" width="1120" height="1" fill="#23233a"/>

  <!-- Pull Script for NAS -->
  <text x="160" y="580" class="text-mono" font-size="14" font-weight="600">Pull Script for NAS</text>
  <text x="160" y="600" class="text-muted" font-size="10">Use this rsync command on your NAS to pull backups:</text>

  <rect class="code-bg" x="160" y="612" width="1120" height="80"/>
  <text x="176" y="636" fill="#22c55e" font-family="JetBrains Mono" font-size="10">#!/bin/bash</text>
  <text x="176" y="656" fill="#f59e0b" font-family="JetBrains Mono" font-size="10">rsync</text>
  <text x="220" y="656" fill="#22c55e" font-family="JetBrains Mono" font-size="10">-avz --delete \</text>
  <text x="176" y="676" fill="#22c55e" font-family="JetBrains Mono" font-size="10">  user@homelab-server:/mnt/backups/ /volume1/docker-backups/</text>

  <text x="1280" y="880" class="text-muted" font-size="9" text-anchor="end">HLC — Backup (Settings Tab)</text>
</svg>
