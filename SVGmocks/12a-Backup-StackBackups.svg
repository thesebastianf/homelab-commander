<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <rect class="dialog" x="120" y="10" width="1200" height="880"/>

  <!-- Header -->
  <text x="160" y="48" class="text-mono" font-size="20" font-weight="700">💾 Backup Management</text>
  <text x="160" y="68" class="text-muted" font-size="12">Configure automated backups for stacks and volumes</text>
  <text x="1280" y="46" class="text-muted" font-size="20">✕</text>

  <!-- 3 Tabs -->
  <rect x="160" y="82" width="1120" height="1" fill="#23233a"/>
  <rect x="160" y="82" width="110" height="2" fill="#6d5acd"/>
  <text x="168" y="104" class="text-mono" font-size="11" font-weight="500" fill="#e4e4e7">Stack Backups</text>
  <text x="296" y="104" class="text-muted-mono" font-size="11">Backup History</text>
  <text x="416" y="104" class="text-muted-mono" font-size="11">Settings</text>

  <!-- ========== Stack Backup: web-stack (expanded) ========== -->
  <rect class="card" x="160" y="120" width="1120" height="500"/>
  <rect x="160" y="120" width="4" height="40" rx="2" fill="#22c55e"/>

  <!-- Stack header row -->
  <text x="186" y="146" class="text-mono" font-size="14" font-weight="600">web-stack</text>
  <rect x="286" y="132" width="50" height="20" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)"/>
  <text x="296" y="146" fill="#22c55e" font-size="9" font-family="JetBrains Mono">Active</text>
  <text x="350" y="146" class="text-muted" font-size="10">3 services • /opt/stacks/web-stack</text>
  <text x="600" y="146" class="text-muted" font-size="10">Last: Jan 15 02:00 · 45.2 MB</text>

  <!-- Toggle + buttons -->
  <rect x="1060" y="132" width="40" height="22" rx="11" fill="#6d5acd"/>
  <circle cx="1090" cy="143" r="8" fill="#fff"/>
  <rect x="1110" y="130" width="70" height="26" rx="6" stroke="#23233a" fill="transparent"/>
  <text x="1118" y="148" class="text-muted" font-size="9">Configure</text>
  <rect x="1190" y="130" width="70" height="26" rx="6" fill="rgba(109,90,205,0.12)" stroke="rgba(109,90,205,0.3)"/>
  <text x="1196" y="148" fill="#6d5acd" font-size="9" font-family="Roboto">Backup Now</text>

  <!-- Expanded config accordion -->
  <rect x="186" y="166" width="1068" height="1" fill="#23233a"/>

  <!-- Schedule & Timing -->
  <text x="186" y="192" class="text-mono" font-size="12" font-weight="600">Schedule &amp; Timing</text>
  <text x="186" y="214" class="text-muted" font-size="10">Backup Schedule</text>
  <rect class="input-bg" x="186" y="222" width="240" height="28"/>
  <text x="200" y="241" class="text-mono" font-size="10">Daily at 2:00 AM</text>
  <text x="414" y="241" class="text-muted" font-size="10">▼</text>
  <text x="450" y="214" class="text-muted" font-size="10">cron: 0 2 * * *</text>
  <text x="450" y="241" class="text-muted" font-size="10">Next: Jan 16, 2024 02:00</text>

  <rect x="186" y="262" width="1068" height="1" fill="rgba(35,35,58,0.5)"/>

  <!-- Retention Policy -->
  <text x="186" y="288" class="text-mono" font-size="12" font-weight="600">Retention Policy</text>
  <text x="340" y="288" class="text-muted" font-size="10">Advanced Retention</text>
  <rect x="450" y="274" width="36" height="20" rx="10" fill="#6d5acd"/>
  <circle cx="476" cy="284" r="7" fill="#fff"/>

  <!-- Advanced retention fields -->
  <text x="186" y="314" class="text-muted" font-size="10">Daily</text>
  <rect class="input-bg" x="186" y="320" width="70" height="26"/>
  <text x="200" y="338" class="text-mono" font-size="10">7</text>
  <text x="276" y="314" class="text-muted" font-size="10">Weekly</text>
  <rect class="input-bg" x="276" y="320" width="70" height="26"/>
  <text x="290" y="338" class="text-mono" font-size="10">4</text>
  <text x="366" y="314" class="text-muted" font-size="10">Monthly</text>
  <rect class="input-bg" x="366" y="320" width="70" height="26"/>
  <text x="380" y="338" class="text-mono" font-size="10">6</text>
  <text x="456" y="314" class="text-muted" font-size="10">Yearly</text>
  <rect class="input-bg" x="456" y="320" width="70" height="26"/>
  <text x="470" y="338" class="text-mono" font-size="10">2</text>

  <!-- Info card -->
  <rect x="560" y="308" width="420" height="40" rx="6" fill="rgba(59,130,246,0.04)" stroke="rgba(59,130,246,0.2)"/>
  <text x="576" y="326" fill="#3b82f6" font-size="9" font-family="Roboto">ℹ Keep 7 daily, 4 weekly, 6 monthly, 2 yearly backups</text>
  <text x="576" y="340" fill="#3b82f6" font-size="9" font-family="Roboto">  Estimated max storage: ~850 MB</text>

  <rect x="186" y="358" width="1068" height="1" fill="rgba(35,35,58,0.5)"/>

  <!-- Backup Contents -->
  <text x="186" y="384" class="text-mono" font-size="12" font-weight="600">Backup Contents</text>

  <text x="186" y="408" class="text-muted" font-size="10">Stack Folder (compose + env)</text>
  <rect x="370" y="394" width="36" height="20" rx="10" fill="#6d5acd"/>
  <circle cx="396" cy="404" r="7" fill="#fff"/>

  <text x="430" y="408" class="text-muted" font-size="10">Volumes (persistent data)</text>
  <rect x="606" y="394" width="36" height="20" rx="10" fill="#6d5acd"/>
  <circle cx="632" cy="404" r="7" fill="#fff"/>

  <text x="666" y="408" class="text-muted" font-size="10">Database Dumps</text>
  <rect x="788" y="394" width="36" height="20" rx="10" fill="#6d5acd"/>
  <circle cx="814" cy="404" r="7" fill="#fff"/>

  <!-- DB config (shown when DB dumps enabled) -->
  <text x="186" y="438" class="text-muted" font-size="10">Database Type</text>
  <rect class="input-bg" x="186" y="444" width="160" height="26"/>
  <text x="200" y="462" class="text-mono" font-size="10">MySQL/MariaDB</text>
  <text x="370" y="438" class="text-muted" font-size="10">Container Name</text>
  <rect class="input-bg" x="370" y="444" width="160" height="26"/>
  <text x="384" y="462" class="text-mono" font-size="10">db</text>
  <text x="554" y="438" class="text-muted" font-size="10">Database Name</text>
  <rect class="input-bg" x="554" y="444" width="160" height="26"/>
  <text x="568" y="462" class="text-mono" font-size="10">wordpress</text>

  <rect x="186" y="482" width="1068" height="1" fill="rgba(35,35,58,0.5)"/>

  <!-- Advanced Options -->
  <text x="186" y="508" class="text-mono" font-size="12" font-weight="600">Advanced Options</text>
  <text x="186" y="530" class="text-muted" font-size="10">Compression</text>
  <rect class="input-bg" x="186" y="536" width="150" height="26"/>
  <text x="200" y="554" class="text-mono" font-size="10">Balanced (gzip -6)</text>

  <text x="360" y="530" class="text-muted" font-size="10">Incremental</text>
  <rect x="360" y="540" width="36" height="20" rx="10" fill="#23233a"/>
  <circle cx="372" cy="550" r="7" fill="#71717a"/>

  <text x="420" y="530" class="text-muted" font-size="10">Encrypt (AES-256)</text>
  <rect x="420" y="540" width="36" height="20" rx="10" fill="#23233a"/>
  <circle cx="432" cy="550" r="7" fill="#71717a"/>

  <!-- ========== Stack Backup: database-stack (collapsed) ========== -->
  <rect class="card" x="160" y="632" width="1120" height="50"/>
  <rect x="160" y="632" width="4" height="50" rx="2" fill="#22c55e"/>
  <text x="186" y="662" class="text-mono" font-size="14" font-weight="600">database-stack</text>
  <rect x="310" y="648" width="50" height="20" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)"/>
  <text x="320" y="662" fill="#22c55e" font-size="9" font-family="JetBrains Mono">Active</text>
  <text x="374" y="662" class="text-muted" font-size="10">2 services • Every 6 hours • Last: Jan 15 06:00 · 128.7 MB</text>
  <rect x="1060" y="646" width="40" height="22" rx="11" fill="#6d5acd"/>
  <circle cx="1090" cy="657" r="8" fill="#fff"/>

  <!-- ========== Stack Backup: monitoring-stack (collapsed) ========== -->
  <rect class="card" x="160" y="694" width="1120" height="50"/>
  <rect x="160" y="694" width="4" height="50" rx="2" fill="#22c55e"/>
  <text x="186" y="724" class="text-mono" font-size="14" font-weight="600">monitoring-stack</text>
  <rect x="330" y="710" width="50" height="20" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)"/>
  <text x="340" y="724" fill="#22c55e" font-size="9" font-family="JetBrains Mono">Active</text>
  <text x="394" y="724" class="text-muted" font-size="10">4 services • Daily 3:00 AM • Last: Jan 15 03:00 · 32.1 MB</text>
  <rect x="1060" y="708" width="40" height="22" rx="11" fill="#6d5acd"/>
  <circle cx="1090" cy="719" r="8" fill="#fff"/>

  <!-- ========== Stack Backup: backup-stack (disabled) ========== -->
  <rect class="card" x="160" y="756" width="1120" height="50"/>
  <text x="186" y="786" class="text-mono" font-size="14" font-weight="600" fill="#71717a">backup-stack</text>
  <rect x="296" y="772" width="60" height="20" rx="6" fill="rgba(113,113,122,0.1)" stroke="#23233a"/>
  <text x="306" y="786" class="text-muted-mono" font-size="9">Inactive</text>
  <text x="370" y="786" class="text-muted" font-size="10">2 services • No backups configured</text>
  <rect x="1060" y="770" width="40" height="22" rx="11" fill="#23233a"/>
  <circle cx="1072" cy="781" r="8" fill="#71717a"/>

  <!-- ========== media-stack (disabled) ========== -->
  <rect class="card" x="160" y="818" width="1120" height="50"/>
  <text x="186" y="848" class="text-mono" font-size="14" font-weight="600" fill="#71717a">media-stack</text>
  <rect x="290" y="834" width="60" height="20" rx="6" fill="rgba(113,113,122,0.1)" stroke="#23233a"/>
  <text x="300" y="848" class="text-muted-mono" font-size="9">Inactive</text>
  <text x="364" y="848" class="text-muted" font-size="10">3 services • No backups configured</text>
  <rect x="1060" y="832" width="40" height="22" rx="11" fill="#23233a"/>
  <circle cx="1072" cy="843" r="8" fill="#71717a"/>

  <text x="1280" y="880" class="text-muted" font-size="9" text-anchor="end">HLC — Backup (Stack Backups Tab)</text>
</svg>
