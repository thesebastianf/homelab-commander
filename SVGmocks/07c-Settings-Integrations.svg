<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .overlay { fill: rgba(0,0,0,0.7); }
      .dialog { fill: #13131a; stroke: #23233a; stroke-width: 1; rx: 16; }
      .text-mono { fill: #e4e4e7; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #71717a; font-family: 'Roboto', sans-serif; }
      .text-muted-mono { fill: #71717a; font-family: 'JetBrains Mono', monospace; }
      .input-bg { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 8; }
      .section-card { fill: #0a0a0f; stroke: #23233a; stroke-width: 1; rx: 10; }
      .code-bg { fill: #080810; stroke: #23233a; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="overlay" width="1440" height="900"/>

  <rect class="dialog" x="220" y="30" width="1000" height="840"/>

  <!-- Header -->
  <text x="260" y="72" class="text-mono" font-size="20" font-weight="700">⚙️ Settings</text>
  <text x="260" y="92" class="text-muted" font-size="12">Configure your homelab command center preferences</text>
  <text x="1180" y="70" class="text-muted" font-size="20">✕</text>

  <!-- Tabs -->
  <rect x="260" y="112" width="940" height="40" rx="8" fill="#0a0a0f" stroke="#23233a"/>
  <text x="300" y="137" class="text-muted" font-size="12">📁 General</text>
  <text x="452" y="137" class="text-muted" font-size="12">🔔 Notifications</text>
  <rect x="562" y="114" width="160" height="36" rx="7" fill="#1a1a2e"/>
  <text x="580" y="137" fill="#e4e4e7" font-family="Roboto" font-size="12" font-weight="500">🔗 Integrations</text>

  <!-- ========== INTEGRATIONS TAB ========== -->

  <!-- Home Assistant Integration Card -->
  <rect class="section-card" x="260" y="172" width="920" height="530"/>

  <text x="296" y="206" class="text-mono" font-size="15" font-weight="700">🏠 Home Assistant Integration</text>
  <rect x="518" y="192" width="64" height="20" rx="6" fill="rgba(113,113,122,0.1)" stroke="#23233a"/>
  <text x="528" y="206" class="text-muted-mono" font-size="10">Disabled</text>

  <text x="296" y="230" class="text-muted" font-size="11">Expose update freeze status and other controls to Home</text>
  <text x="296" y="246" class="text-muted" font-size="11">Assistant for automation</text>

  <!-- Enable toggle -->
  <rect x="1100" y="194" width="40" height="22" rx="11" fill="#23233a"/>
  <circle cx="1112" cy="205" r="8" fill="#71717a"/>

  <rect x="296" y="264" width="844" height="1" fill="#23233a"/>

  <!-- HA Base URL (shown when enabled, showing fields as if about to enable) -->
  <text x="296" y="296" class="text-muted" font-size="11">Base URL</text>
  <rect class="input-bg" x="296" y="304" width="500" height="34"/>
  <text x="312" y="326" class="text-muted-mono" font-size="11">http://homeassistant.local:8123</text>

  <!-- Long-Lived Access Token -->
  <text x="296" y="360" class="text-muted" font-size="11">Long-Lived Access Token</text>
  <rect class="input-bg" x="296" y="368" width="500" height="34"/>
  <text x="312" y="390" class="text-muted-mono" font-size="11">eyJhbGciOiJIUzI1NiIsInR5cCI6...</text>

  <!-- Entity Prefix -->
  <text x="296" y="424" class="text-muted" font-size="11">Entity Prefix</text>
  <rect class="input-bg" x="296" y="432" width="200" height="34"/>
  <text x="312" y="454" class="text-mono" font-size="11">hlc</text>

  <rect x="296" y="484" width="844" height="1" fill="#23233a"/>

  <!-- Available Entities -->
  <text x="296" y="514" class="text-mono" font-size="12" font-weight="600">Available Entities</text>
  <text x="296" y="542" class="text-muted-mono" font-size="11">switch.hlc_global_update_freeze</text>
  <text x="296" y="562" class="text-muted-mono" font-size="11">switch.hlc_auto_update</text>
  <text x="296" y="582" class="text-muted-mono" font-size="11">sensor.hlc_containers_running</text>
  <text x="296" y="602" class="text-muted-mono" font-size="11">sensor.hlc_updates_available</text>

  <rect x="296" y="620" width="844" height="1" fill="#23233a"/>

  <!-- Example Automation -->
  <text x="296" y="648" class="text-mono" font-size="12" font-weight="600">Example Automation</text>
  <rect class="code-bg" x="296" y="658" width="844" height="30"/>
  <text x="312" y="678" class="text-muted-mono" font-size="9">alias: 'HLC: Notify on Update Freeze Change'  trigger: - platform: state  entity_id: switch.hlc_global...</text>

  <!-- Footer -->
  <rect x="260" y="728" width="940" height="1" fill="#23233a"/>
  <rect x="980" y="748" width="80" height="36" rx="8" stroke="#23233a" fill="transparent"/>
  <text x="998" y="771" class="text-muted" font-size="12">Cancel</text>
  <rect x="1080" y="748" width="120" height="36" rx="8" fill="#3b82f6"/>
  <text x="1098" y="771" fill="#fff" font-family="Roboto" font-size="12" font-weight="500">Save Changes</text>

  <text x="1180" y="858" class="text-muted" font-size="9" text-anchor="end">HLC — Settings Dialog (Integrations Tab)</text>
</svg>
