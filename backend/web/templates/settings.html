{{define "content"}}
<div class="top-bar">
  <div>
    <div class="page-title">Settings</div>
    <div class="page-subtitle">System configuration &amp; policies</div>
  </div>
</div>

<div class="tab-bar" id="settings-tabs">
  <div class="tab active" onclick="switchTab('general')">General</div>
  <div class="tab" onclick="switchTab('policies')">Policies</div>
  <div class="tab" onclick="switchTab('env-hub')">Env Hub</div>
</div>

<!-- General Settings -->
<div id="tab-general" class="tab-content active g-card">
  <div class="section-title">Application Settings</div>
  <div id="settings-form" hx-get="/api/v1/settings" hx-trigger="load" hx-swap="innerHTML">
    <div class="loading">Loading settings…</div>
  </div>
</div>

<!-- Policies -->
<div id="tab-policies" class="tab-content g-card">
  <div class="section-title">Active Policies</div>
  <div id="policies-list" hx-get="/api/v1/policies" hx-trigger="revealed" hx-swap="innerHTML">
    <div class="loading">Loading policies…</div>
  </div>
</div>

<!-- Env Hub -->
<div id="tab-env-hub" class="tab-content g-card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem">
    <div class="section-title" style="margin-bottom:0">Global Environment Variables</div>
    <button class="btn btn-xs btn-primary" onclick="document.getElementById('add-env-modal').classList.add('open')">+ Add</button>
  </div>
  <div id="env-list" hx-get="/api/v1/env-hub" hx-trigger="load" hx-swap="innerHTML">
    <div class="loading">Loading env vars…</div>
  </div>
</div>

<!-- Add Env Modal -->
<div id="add-env-modal" class="modal-backdrop">
  <div class="modal g-card">
    <div class="modal-title">Add Environment Variable</div>
    <form hx-post="/api/v1/env-hub" hx-swap="none" hx-on::after-request="document.getElementById('add-env-modal').classList.remove('open');htmx.trigger('#env-list','load')">
      <div class="form-group">
        <label class="form-label">Key</label>
        <input name="key" type="text" class="form-input mono" placeholder="PUID" required>
      </div>
      <div class="form-group" style="margin-top:.6rem">
        <label class="form-label">Value</label>
        <input name="value" type="text" class="form-input mono" placeholder="1000">
      </div>
      <div class="form-group" style="margin-top:.6rem">
        <label class="form-label">Category</label>
        <select name="category" class="form-input">
          <option value="global">global</option>
          <option value="path">path</option>
          <option value="secret">secret</option>
        </select>
      </div>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
        <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-backdrop').classList.remove('open')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>

<script>
function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('#settings-tabs .tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
}
</script>
{{end}}
