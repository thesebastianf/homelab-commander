{{define "content"}}
<div class="top-bar">
  <div>
    <div class="page-title">Dashboard</div>
    <div class="page-subtitle">System Overview</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:.6rem;align-items:center">
    <div id="msm-badge" class="badge badge-green">Loading…</div>
  </div>
</div>

<div class="stat-grid" id="stat-grid">
  <div class="stat-card">
    <div class="stat-label">Containers Running</div>
    <div class="stat-value" id="stat-running">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Containers Stopped</div>
    <div class="stat-value" id="stat-stopped">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Updates Available</div>
    <div class="stat-value" id="stat-updates">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Mounts Healthy</div>
    <div class="stat-value" id="stat-mounts">—</div>
  </div>
</div>

<div class="section-title">
  <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/></svg>
  Containers
</div>
<div class="g-card" hx-get="/ui/containers" hx-trigger="load, every 15s" hx-swap="innerHTML">
  <div class="loading">Loading containers…</div>
</div>

<div class="section-title" style="margin-top:1.4rem">
  <svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
  Stacks
</div>
<div class="g-card" hx-get="/ui/stacks" hx-trigger="load" hx-swap="innerHTML">
  <div class="loading">Loading stacks…</div>
</div>

<script>
function loadStatus() {
  fetch('/api/v1/status')
    .then(r => r.json())
    .then(d => {
      document.getElementById('stat-running').textContent = d.containers?.running ?? '—';
      document.getElementById('stat-stopped').textContent = d.containers?.stopped ?? '—';
      document.getElementById('stat-updates').textContent = d.updates?.available ?? '—';
      const mounts = d.mounts ? (d.mounts.healthy + '/' + (d.mounts.healthy + d.mounts.degraded + d.mounts.offline)) : '—';
      document.getElementById('stat-mounts').textContent = mounts;
      const badge = document.getElementById('msm-badge');
      if (d.msm_active) {
        badge.className = 'badge badge-yellow';
        badge.textContent = 'MSM Active';
      } else {
        badge.className = 'badge badge-green';
        badge.textContent = 'Normal Mode';
      }
    })
    .catch(() => {});
}
loadStatus();
setInterval(loadStatus, 30000);
</script>
{{end}}
