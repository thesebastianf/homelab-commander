##############################################################################
# HomeLab Commander V2 — docker-compose.yml
#
# Quick-start:
#   cp .env.example .env       # Edit values to match your paths
#   docker compose up -d
#   open http://localhost:8080
##############################################################################

services:
  hlc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hlc:latest
    pull_policy: build
    container_name: homelab-commander
    restart: unless-stopped

    ports:
      - "${HLC_HOST_PORT:-8080}:8080"

    environment:
      HLC_LISTEN: ":8080"
      HLC_DATA_DIR: /data
      HLC_DB_PATH: /data/hlc.db
      HLC_BACKUP_DIR: /data/backups
      HLC_STACK_DIR: /stacks
      HLC_NAS_ANCHOR: "${HLC_NAS_ANCHOR:-.nas-ready}"
      DOCKER_SOCKET: /var/run/docker.sock
      HLC_ADMIN_TOKEN: "${HLC_ADMIN_TOKEN:-}"
      TZ: "${TZ:-Europe/London}"

    volumes:
      # Docker socket — required for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Persistent data (database, session state)
      - hlc-data:/data

      # Backups destination — override to a NAS path for off-box storage
      - "${HLC_BACKUP_HOST_DIR:-hlc-backups}:/data/backups"

      # Stacks directory — must match HLC_STACK_DIR inside the container
      # Override HLC_STACK_DIR_HOST in .env to point at your real stacks path
      - "${HLC_STACK_DIR_HOST:-./stacks}:/stacks"

    # HLC must be able to read the Docker socket
    group_add:
      - "${DOCKER_GID:-999}"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      hlc.role: app
      hlc.homepage.url: "http://localhost:${HLC_HOST_PORT:-8080}"

volumes:
  hlc-data:
    driver: local
  hlc-backups:
    driver: local
