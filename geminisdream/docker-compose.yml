services:
  backend:
    build:
      context: ./backend
    container_name: hlc-dream-backend
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_PATH:-c:/DEV/homelab-commander/stacks}:/stacks
    environment:
      - STACK_PATH=/stacks
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: hlc-dream-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
